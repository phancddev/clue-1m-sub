services:
  app:
    build: ./app
    container_name: clue_1m_sub
    init: true
    restart: unless-stopped
    # CPU cap: poller gần như 0; chỉ render 1 lần (~2-3 phút) dùng tới đây
    cpus: 2.0
    mem_limit: 2g
    env_file: .env
    ports:
      - "8642:4321"
    volumes:
      - ./data:/app/data
    networks: [dbnet]

networks:
  dbnet:
    name: dmoj_db
    external: true
